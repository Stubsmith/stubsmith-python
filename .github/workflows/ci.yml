name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is EOL (October 2024). requires-python is ">=3.9", so this matrix
        # covers the floor and the current release.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: pip install -e '.[test]'

      - name: Run pytest
        # No API key is set - offline tests must pass without any network calls.
        # Live tests in examples/fixtures-testing/tests/test_live_fixtures.py are
        # skipped automatically when STUBSMITH_API_KEY is absent.
        run: pytest -q
